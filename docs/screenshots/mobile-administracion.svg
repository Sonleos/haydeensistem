<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder: administración de medicamentos en la app móvil</title>
  <desc id="desc">Maqueta ilustrativa del registro de administración de medicamentos de Haydeén Sistema con selección de lote y descuento de inventario. Datos sintéticos.</desc>
  <defs>
    <linearGradient id="mh3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="ms3" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="screen3">
      <rect width="390" height="844" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen3)">
    <rect width="390" height="844" fill="#F1F5F9"/>

    <rect width="390" height="140" fill="url(#mh3)"/>
    <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#DBEAFE">9:41</text>
    <g fill="#DBEAFE">
      <rect x="316" y="21" width="16" height="10" rx="2"/>
      <rect x="336" y="20" width="3" height="12" rx="1"/>
      <rect x="342" y="22" width="3" height="10" rx="1"/>
      <rect x="348" y="24" width="3" height="8" rx="1"/>
      <rect x="358" y="21" width="14" height="10" rx="3" fill="none" stroke="#DBEAFE" stroke-width="1.5"/>
      <rect x="360" y="23" width="8" height="6" rx="1"/>
    </g>

    <path d="M38 62l-8 8 8 8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="195" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Administración</text>
    <text x="195" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#BFDBFE" text-anchor="middle">Registrar dosis administrada</text>

    <!-- Patient card -->
    <g filter="url(#ms3)">
      <rect x="24" y="120" width="342" height="86" rx="16" fill="#FFFFFF"/>
    </g>
    <circle cx="56" cy="150" r="18" fill="#DBEAFE"/>
    <text x="56" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">MG</text>
    <text x="84" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">María González R.</text>
    <text x="84" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B">82 años · Habitación A-102</text>
    <rect x="40" y="180" width="104" height="18" rx="9" fill="#FEE2E2"/>
    <text x="92" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#B91C1C" text-anchor="middle">Alergia: penicilina</text>

    <!-- Medication card -->
    <g filter="url(#ms3)">
      <rect x="24" y="222" width="342" height="196" rx="16" fill="#FFFFFF"/>
    </g>
    <text x="40" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.6">MEDICAMENTO</text>
    <text x="40" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Losartán 50 mg</text>
    <text x="40" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B">Tableta · Vía oral</text>

    <rect x="40" y="310" width="150" height="46" rx="10" fill="#F8FAFC"/>
    <text x="52" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#64748B">DOSIS</text>
    <text x="52" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">1 tableta</text>

    <rect x="200" y="310" width="150" height="46" rx="10" fill="#F8FAFC"/>
    <text x="212" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#64748B">HORARIO</text>
    <text x="212" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">08:00</text>

    <text x="40" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.6">LOTE</text>
    <rect x="40" y="386" width="310" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="50" y="401" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0F172A">L-2026-0412 · cad. 30/06/2027</text>
    <path d="M334 394l5 5 5-5" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stock info -->
    <rect x="24" y="434" width="342" height="56" rx="12" fill="#EFF6FF"/>
    <circle cx="46" cy="462" r="10" fill="#DBEAFE"/>
    <text x="46" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">i</text>
    <text x="66" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E40AF">Stock del lote: 24 unidades</text>
    <text x="66" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#3B82F6">Se descontará 1 unidad al confirmar</text>

    <!-- Warning -->
    <rect x="24" y="502" width="342" height="58" rx="12" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="40" y="523" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#B45309">Verifica los cinco correctos</text>
    <text x="40" y="541" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#92400E">Paciente · medicamento · dosis · vía · hora</text>

    <!-- Checkbox -->
    <rect x="24" y="574" width="18" height="18" rx="5" fill="#2563EB"/>
    <path d="M28 583l3 3 6-6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Confirmo la identidad del paciente</text>

    <!-- Button -->
    <rect x="24" y="612" width="342" height="50" rx="14" fill="#2563EB"/>
    <text x="195" y="643" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Registrar administración</text>

    <text x="195" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">El registro queda asociado a tu sesión</text>
  </g>
  <rect x="0.75" y="0.75" width="388.5" height="842.5" rx="30" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
</svg>
