<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder: pacientes en la app móvil</title>
  <desc id="desc">Maqueta ilustrativa de la pantalla de pacientes de la app móvil de Haydeén Sistema, con buscador y tarjetas de residentes. Datos sintéticos.</desc>
  <defs>
