    <rect x="1004" y="46" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="1024" cy="63" r="5" fill="#16A34A"/>
    <text x="1038" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">API en línea</text>

