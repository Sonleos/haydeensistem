      <rect x="56" y="226" width="16" height="16" rx="4" fill="#475569"/>
      <text x="84" y="240">Personal</text>
      <rect x="56" y="274" width="16" height="16" rx="4" fill="#475569"/>
      <text x="84" y="288">Inventario</text>
      <rect x="56" y="322" width="16" height="16" rx="4" fill="#475569"/>
      <text x="84" y="336">Tratamientos</text>
      <rect x="56" y="370" width="16" height="16" rx="4" fill="#475569"/>
