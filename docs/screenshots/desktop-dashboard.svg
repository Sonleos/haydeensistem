      <text x="393" y="490">Ana Ríos P.</text>
      <text x="585" y="490" fill="#334155">Omeprazol 20 mg</text>
      <text x="800" y="490" fill="#334155">A-108</text>
      <rect x="918" y="476" width="60" height="20" rx="10" fill="#FEF3C7"/>
      <text x="948" y="490" font-size="10" font-weight="600" fill="#B45309" text-anchor="middle">Pendiente</text>

      <line x1="309" y1="508" x2="1101" y2="508" stroke="#F1F5F9"/>
      <text x="321" y="534" font-weight="600">09:30</text>
      <text x="393" y="534">Luis Herrera S.</text>
      <text x="585" y="534" fill="#334155">Insulina glargina</text>
      <text x="800" y="534" fill="#334155">C-301</text>
      <rect x="918" y="520" width="60" height="20" rx="10" fill="#FEF3C7"/>
      <text x="948" y="534" font-size="10" font-weight="600" fill="#B45309" text-anchor="middle">Pendiente</text>

      <line x1="309" y1="552" x2="1101" y2="552" stroke="#F1F5F9"/>
      <text x="321" y="578" font-weight="600">10:00</text>
      <text x="393" y="578">Carmen Delgado M.</text>
      <text x="585" y="578" fill="#334155">Calcio + vitamina D</text>
      <text x="800" y="578" fill="#334155">B-210</text>
      <rect x="918" y="564" width="60" height="20" rx="10" fill="#FEF3C7"/>
      <text x="948" y="578" font-size="10" font-weight="600" fill="#B45309" text-anchor="middle">Pendiente</text>

      <line x1="309" y1="596" x2="1101" y2="596" stroke="#F1F5F9"/>
      <text x="321" y="622" font-weight="600">10:30</text>
      <text x="393" y="622">Rosa Núñez V.</text>
      <text x="585" y="622" fill="#334155">Furosemida 40 mg</text>
      <text x="800" y="622" fill="#334155">A-115</text>
      <rect x="918" y="608" width="60" height="20" rx="10" fill="#FEF3C7"/>
      <text x="948" y="622" font-size="10" font-weight="600" fill="#B45309" text-anchor="middle">Pendiente</text>
