    <text x="90" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Administrador</text>
    <text x="90" y="674" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94A3B8">admin · admin</text>
    <text x="56" y="702" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">v0.1.0</text>

