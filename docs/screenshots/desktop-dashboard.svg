<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder: dashboard del panel de escritorio</title>
  <desc id="desc">Maqueta ilustrativa del dashboard de Haydeén Sistema con tarjetas de totales y tabla de próximas administraciones. Datos sintéticos.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <clipPath id="win">
      <rect x="20" y="20" width="1160" height="720" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="760" fill="#E2E8F0"/>
  <g clip-path="url(#win)">
    <rect x="20" y="20" width="1160" height="720" fill="#F1F5F9"/>

    <!-- Sidebar -->
    <rect x="20" y="20" width="230" height="720" fill="#0F172A"/>
    <circle cx="56" cy="64" r="17" fill="url(#brand)"/>
    <path d="M56 55v18M47 64h18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="84" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#F8FAFC">Haydeén</text>

    <rect x="40" y="116" width="190" height="44" rx="10" fill="#1E293B"/>
    <rect x="56" y="130" width="16" height="16" rx="4" fill="#3B82F6"/>
