name: Reporte de error
description: Algo no funciona como se espera.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. **No incluyas datos reales de pacientes, credenciales ni secretos.**
        Si el problema es de seguridad, usa el canal privado de SECURITY.md.

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué esperabas que pasara y qué pasó realmente.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Iniciar sesión como ...
        2. Abrir ...
        3. Registrar ...
        4. Ver error ...
    validations:
      required: true

  - type: dropdown
    id: componente
    attributes:
      label: Componente
      options:
        - API (FastAPI)
        - Panel de escritorio (CustomTkinter)
        - App móvil (web)
        - Base de datos / migración
        - Scripts / seeder
        - Documentación
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: "v0.1.0 / abc1234"
    validations:
      required: true

  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Windows 11, Python 3.14.10, MySQL 8.4.3, Chrome 130"
    validations:
      required: true

  - type: dropdown
    id: rol
    attributes:
      label: Rol con el que ocurre
      options:
        - admin
        - medico
        - enfermero
        - administrativo
        - otro / no aplica
    validations:
      required: false

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Logs, capturas o respuesta de API sin datos sensibles.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmaciones
    attributes:
      label: Confirmaciones
      options:
        - label: Usé datos sintéticos y no incluí información real de pacientes.
          required: true
        - label: Revisé que no haya un issue duplicado.
          required: true
