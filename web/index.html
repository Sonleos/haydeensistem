<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Haydeén · Enfermería</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-slate-100 text-slate-900 antialiased">

  <!-- Login -->
  <section id="login-screen" class="min-h-screen bg-slate-950 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <p class="text-blue-400 font-bold tracking-[0.3em] text-xs">HAYDEÉN</p>
        <h1 class="text-white text-3xl font-bold mt-2">Acceso de enfermería</h1>
        <p class="text-slate-400 text-sm mt-2">Registra signos vitales y administra medicación.</p>
      </div>

      <div class="bg-white rounded-3xl p-6 shadow-2xl">
        <form id="login-form" class="space-y-4" novalidate>
          <div>
            <label for="username" class="block text-xs font-bold text-slate-600 mb-1.5">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username"
                   class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base outline-none focus:border-blue-500 focus:bg-white"
                   placeholder="admin">
          </div>
          <div>
            <label for="password" class="block text-xs font-bold text-slate-600 mb-1.5">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base outline-none focus:border-blue-500 focus:bg-white"
                   placeholder="••••••••">
          </div>
          <p id="login-error" class="hidden rounded-xl bg-rose-50 px-3 py-2 text-xs font-medium text-rose-700"></p>
          <button id="login-button" type="submit"
                  class="w-full rounded-xl bg-blue-600 px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-blue-600/25 active:scale-[0.99] disabled:opacity-60">
            Entrar
          </button>
        </form>
        <p class="text-xs text-slate-400 mt-4 text-center">Acceso restringido. Solicita tus credenciales al administrador.</p>
      </div>
    </div>
  </section>

  <!-- Aplicación -->
  <div id="app-screen" class="hidden min-h-screen">
    <header class="sticky top-0 z-30 bg-slate-950 text-white">
      <div class="mx-auto max-w-3xl px-4 py-4 flex items-center justify-between gap-3">
        <div>
          <p class="text-[10px] font-bold tracking-[0.25em] text-blue-400">HAYDEÉN</p>
          <h1 class="text-lg font-bold leading-tight">Enfermería</h1>
        </div>
        <div class="flex items-center gap-3">
          <div class="text-right max-w-[150px]">
            <p id="user-name" class="text-sm font-semibold truncate"></p>
            <p id="user-role" class="text-[11px] text-slate-400 truncate"></p>
          </div>
          <button id="logout-button" type="button"
                  class="rounded-lg border border-slate-700 px-2.5 py-2 text-xs font-semibold text-slate-300 active:bg-slate-800">
            Salir
          </button>
        </div>
      </div>
    </header>

    <main id="view-container" class="mx-auto max-w-3xl px-4 pt-4 safe-bottom"></main>

    <nav class="fixed bottom-0 inset-x-0 z-40 border-t border-slate-200 bg-white/95 backdrop-blur safe-nav">
      <div class="mx-auto max-w-3xl grid grid-cols-3">
        <button data-nav="pacientes" type="button" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
          </svg>
          <span>Pacientes</span>
        </button>
        <button data-nav="tratamientos" type="button" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c.251.023.501.05.75.082m-.75-.082a24.301 24.301 0 004.5 0m-4.5 0v5.714c0 .597.237 1.17.659 1.591L14.25 14.5m4.5 0l-2.25-2.25m-7.5 0l-2.25 2.25m10.5 0a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0z"/>
          </svg>
          <span>Tratamientos</span>
        </button>
        <button data-nav="control" type="button" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12h3.75l2.25-6 3.75 12 2.25-6H21"/>
          </svg>
          <span>Control</span>
        </button>
      </div>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="fixed inset-x-0 bottom-24 z-[60] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
